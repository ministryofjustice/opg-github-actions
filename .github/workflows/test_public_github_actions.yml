name: "[TEST] Public GitHub Actions"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  id-token: write
jobs:

  branch_name_from_env:
    name: "branch-name (from env)"
    runs-on: ubuntu-latest
    steps:
      # checkout self
      - name: "Checkout"
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      # run the branch-name action from env values
      - name: "Branch Name"
        id: "branchname"
        uses: ./actions/branch-name
      # summary
      - name: "Summary"
        run: |
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |"  >> $GITHUB_STEP_SUMMARY
          echo "| branch_name | ${{ steps.branchname.outputs.branch_name }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| full_length | ${{ steps.branchname.outputs.full_length }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| safe | ${{ steps.branchname.outputs.safe }} |"  >> $GITHUB_STEP_SUMMARY

  branch_name_fixed:
    name: "branch-name (fixed values)"
    runs-on: ubuntu-latest
    steps:
      # checkout self
      - name: "Checkout"
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      # run the branch-name action from env values
      - name: "Branch Name"
        id: "branchname"
        uses: ./actions/branch-name
        with:
          name: "test !/branch name thats really long and has odd things in &!@£$"
      # summary
      - name: "Summary"
        run: |
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |"  >> $GITHUB_STEP_SUMMARY
          echo "| branch_name | ${{ steps.branchname.outputs.branch_name }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| full_length | ${{ steps.branchname.outputs.full_length }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| safe | ${{ steps.branchname.outputs.safe }} |"  >> $GITHUB_STEP_SUMMARY

  terraform_version:
    name: "terraform-version"
    runs-on: ubuntu-latest
    steps:
      # checkout self
      - name: "Checkout"
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: "Terraform Version"
        id: "terraformversion"
        uses: ./actions/terraform-version
        with:
          terraform_directory: ./terraform/account
      # summary
      - name: "Summary"
        run: |
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |"  >> $GITHUB_STEP_SUMMARY
          echo "| version | ${{ steps.terraformversion.outputs.version }} |"  >> $GITHUB_STEP_SUMMARY

  terraform_workspace_manager:
    runs-on: 'ubuntu-latest'
    name: "terraform-workspace-manager"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
      - id: test1
        name: "Test registration"
        uses: ./actions/terraform-workspace-manager
        with:
          # sandbox
          oidc_role: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::631181914621:role/oidc-opg-github-actions-production' || 'arn:aws:iam::631181914621:role/oidc-opg-github-actions-development' }}
          aws_account_id: '995199299616'
          aws_iam_role: 'gh-reusable-actions-ci'
          register_workspace: "t${{github.sha}}"
          # short ttl
          time_to_protect: 1
      - id: test2
        name: "Test listing"
        uses: ./actions/terraform-workspace-manager
        with:
          oidc_role: ${{ github.ref == 'refs/heads/main' && 'arn:aws:iam::631181914621:role/oidc-opg-github-actions-production' || 'arn:aws:iam::631181914621:role/oidc-opg-github-actions-development' }}
          aws_account_id: '995199299616'
          aws_iam_role: 'gh-reusable-actions-ci'
      - id: test_results
        name: Test results
        run: |
          ws1="t${{github.sha}}"
          pw1="${{steps.test1.outputs.protected_workspaces}}"
          pw2="${{steps.test2.outputs.protected_workspaces}}"

          if [[ "${pw1}" != *"${ws1}"* ]]; then
            echo "workspace not found"
            exit 1
          fi

          if [[ "${pw1}" != "${pw2}" ]]; then
            echo "workspace list has changed"
            exit 1
          fi

  detect_changes:
    name: "detect-changes"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: "Detect changes"
        id: detect
        uses: ./actions/detect-changes
        with:
          paths: |
            actions/**

      - name: "Summary"
        run: |
          if [[ "${{ steps.detect.outputs.has_changes }}" != "true" && "${{ steps.detect.outputs.has_changes }}" != "false" ]]; then
            echo "has_changes is not a valid boolean: ${{ steps.detect.outputs.has_changes }}"
            exit 1
          fi

          if [[ "${{ steps.detect.outputs.only_changed }}" != "true" && "${{ steps.detect.outputs.only_changed }}" != "false" ]]; then
            echo "only_changed is not a valid boolean: ${{ steps.detect.outputs.only_changed }}"
            exit 1
          fi

          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| has_changes | ${{ steps.detect.outputs.has_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| only_changed | ${{ steps.detect.outputs.only_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| files | ${{ steps.detect.outputs.files }} |" >> $GITHUB_STEP_SUMMARY

  verify_readonly_fs:
    name: "verify-readonly-fs"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Mock SSM JSON and compose file
      - name: "Set up mock mounts JSON and compose file"
        id: setup
        shell: bash
        run: |
          set -euo pipefail

          mounts_json=$(jq -n '{
            "api-app": {"tmpfs": [{"containerPath": "/tmp", "size": 64}, {"containerPath": "/tmp/cache", "size": 32}]}
          }')
          echo "mounts_json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$mounts_json" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          printf '%s\n' \
            'services:' \
            '  api-app:' \
            '    image: alpine' \
            '    read_only: true' \
            '    tmpfs:' \
            '      - /tmp:size=67108864' \
            '      - /tmp/cache:size=33554432' \
            > "${RUNNER_TEMP}/docker-compose.yml"

      - name: "Verify (expect pass)"
        id: verify
        uses: ./actions/verify-readonly-fs
        with:
          compose_file: ${{ runner.temp }}/docker-compose.yml
          mounts_json: ${{ steps.setup.outputs.mounts_json }}
          service_json: |
            { "api-app": "api-app" }

      - name: "Assert pass"
        run: |
          if [[ "${{ steps.verify.outputs.passed }}" != "true" ]]; then
            echo "expected passed=true, got '${{ steps.verify.outputs.passed }}'"
            exit 1
          fi

      # Mock compose file with a mismatch
      - name: "Set up failing compose file"
        id: setup_fail
        shell: bash
        run: |
          printf '%s\n' \
            'services:' \
            '  api-app:' \
            '    image: alpine' \
            '    tmpfs:' \
            '      - /tmp:size=1024' \
            > "${RUNNER_TEMP}/docker-compose-bad.yml"

      - name: "Verify (expect fail)"
        id: verify_fail
        continue-on-error: true
        uses: ./actions/verify-readonly-fs
        with:
          compose_file: ${{ runner.temp }}/docker-compose-bad.yml
          mounts_json: ${{ steps.setup.outputs.mounts_json }}
          service_json: |
            { "api-app": "api-app" }

      - name: "Assert failure outputs"
        run: |
          if [[ "${{ steps.verify_fail.outputs.passed }}" != "false" ]]; then
            echo "expected passed=false, got '${{ steps.verify_fail.outputs.passed }}'"
            exit 1
          fi
          if [[ -z "${{ steps.verify_fail.outputs.errors }}" ]]; then
            echo "expected non-empty errors output"
            exit 1
          fi
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| pass/passed | ${{ steps.verify.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| fail/passed | ${{ steps.verify_fail.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| fail/errors | ${{ steps.verify_fail.outputs.errors }} |" >> $GITHUB_STEP_SUMMARY

  end:
    name: 'End'
    runs-on: 'ubuntu-latest'
    needs:
      - branch_name_from_env
      - branch_name_fixed
      - terraform_version
      - terraform_workspace_manager
      - detect_changes
      - verify_readonly_fs
    steps:
      - name: "End"
        id: end
        run: echo "End"
