name: "Verify Read-only Filesystem"
description: >
  Verifies that the read-only filesystem configuration in a docker compose file
  matches the tmpfs mount configuration defined in the infrastructure repository
  (used by ECS).

  For each service in the `service_json` mapping it checks that:
    - the compose service has `read_only: true`
    - every tmpfs path/size declared in the infrastructure config is present in
      compose with the matching byte size
    - the compose service has no extra tmpfs paths that are missing from the
      infrastructure config

  The action fails when any mismatch is found and lists every problem.

  If the infrastructure repository is private, the calling job must already have
  read access configured (for example via an SSH deploy key / ssh-agent, or by
  overriding `infra_repo` with an authenticated HTTPS URL).

inputs:
  service_json:
    description: >
      JSON object mapping each docker compose service name to the infrastructure
      mounts JSON file that defines its expected tmpfs config, e.g.

        {
          "api-app": "api-app.json",
          "queue": "queue-consumer.json",
          "api": "nginx.json",
          "frontend": "nginx.json"
        }
    required: true

  compose_file:
    description: "Path to the docker compose file to verify."
    default: "docker-compose.yml"

  mounts_path:
    description: "Path, within the infrastructure repo, to the directory containing the mounts JSON files."
    required: true

  infra_repo:
    description: "Git URL of the infrastructure repository that holds the mounts JSON config."
    required: true

  infra_branch:
    description: "Branch of the infrastructure repository to read the mounts config from."
    default: "main"

outputs:
  passed:
    description: "'true' when every service matched, 'false' otherwise."
    value: ${{ steps.verify.outputs.passed }}
  errors:
    description: "Newline-delimited list of mismatches (empty when passed)."
    value: ${{ steps.verify.outputs.errors }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        INPUT_SERVICE_JSON: ${{ inputs.service_json }}
        INPUT_COMPOSE_FILE: ${{ inputs.compose_file }}
        INPUT_MOUNTS_PATH: ${{ inputs.mounts_path }}
        INPUT_INFRA_REPO: ${{ inputs.infra_repo }}
        INPUT_INFRA_BRANCH: ${{ inputs.infra_branch }}
      run: |
        set -euo pipefail
        trap 'echo "ERROR: line $LINENO exited with code $?" >&2' ERR

        MIB=1048576

        # Validate the service mapping is a JSON object.
        if ! echo "$INPUT_SERVICE_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
          echo "ERROR: service_json must be a JSON object mapping service name to mounts JSON file." >&2
          exit 1
        fi

        tmpdir=$(mktemp -d)
        compose_stderr=$(mktemp)
        trap 'rm -rf "$tmpdir" "$compose_stderr"' EXIT

        echo "Fetching mounts config from ${INPUT_INFRA_REPO} (branch: ${INPUT_INFRA_BRANCH}) ..."
        git clone --filter=blob:none --sparse --depth=1 --branch "$INPUT_INFRA_BRANCH" \
          "$INPUT_INFRA_REPO" "$tmpdir"
        git -C "$tmpdir" sparse-checkout set "$INPUT_MOUNTS_PATH"
        mounts_dir="$tmpdir/$INPUT_MOUNTS_PATH"

        echo "Rendering compose config from ${INPUT_COMPOSE_FILE} ..."
        compose_json=$(docker compose -f "$INPUT_COMPOSE_FILE" config --format json 2>"$compose_stderr") || {
          echo "ERROR: docker compose -f ${INPUT_COMPOSE_FILE} config --format json failed:" >&2
          cat "$compose_stderr" >&2
          exit 1
        }

        errors=()
        service_count=0

        while IFS=$'\t' read -r svc json_name; do
          service_count=$((service_count + 1))
          json_file="$mounts_dir/$json_name"

          if [[ ! -f "$json_file" ]]; then
            errors+=("$svc: mounts file $json_name not found in ${INPUT_MOUNTS_PATH}")
            continue
          fi

          # Check read_only: true
          read_only=$(echo "$compose_json" | jq -r --arg s "$svc" '.services[$s].read_only // false')
          [[ "$read_only" == "true" ]] || errors+=("$svc: missing read_only: true")

          # Check each expected path/size from the infra JSON
          while IFS=$'\t' read -r path size_mib; do
            expected=$(( size_mib * MIB ))
            actual=$(echo "$compose_json" | jq -r --arg s "$svc" --arg p "$path" \
              '.services[$s].tmpfs[]? | select(startswith($p + ":")) | split("=")[-1]')
            if [[ -z "$actual" ]]; then
              errors+=("$svc: missing tmpfs path $path")
            elif [[ "$actual" != "$expected" ]]; then
              errors+=("$svc: $path size ${actual} bytes != expected ${expected} bytes ($((expected / MIB)) MiB)")
            fi
          done < <(jq -r '.tmpfs[] | [.containerPath, (.size | tostring)] | @tsv' "$json_file")

          # Check for unexpected extra paths in compose
          while IFS= read -r actual_path; do
            found=$(jq -r --arg p "$actual_path" \
              'any(.tmpfs[]; .containerPath == $p) | tostring' "$json_file")
            [[ "$found" == "true" ]] || errors+=("$svc: unexpected tmpfs path $actual_path (not in infrastructure config)")
          done < <(echo "$compose_json" | jq -r --arg s "$svc" '.services[$s].tmpfs[]? | split(":")[0]')
        done < <(echo "$INPUT_SERVICE_JSON" | jq -r 'to_entries[] | [.key, .value] | @tsv')

        {
          echo "errors<<EOF"
          if [[ ${#errors[@]} -gt 0 ]]; then
            printf '%s\n' "${errors[@]}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        if [[ ${#errors[@]} -gt 0 ]]; then
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "FAIL: readonly filesystem config mismatch:"
          printf '  %s\n' "${errors[@]}"
          exit 1
        fi

        echo "passed=true" >> "$GITHUB_OUTPUT"
        echo "OK: all ${service_count} services have correct read_only and tmpfs config"
